services:
  - type: web
    name: los-gotish-soloq-challenge
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: RIOT_API_KEY
        sync: false
      - key: RIOT_PLATFORM
        value: la1
      - key: RIOT_REGION
        value: americas
      - key: CHALLENGE_YEAR
        value: "2026"
      - key: CHALLENGE_MONTH
        value: "8"
      - key: CHALLENGE_TIMEZONE
        value: America/Guayaquil
      - key: CACHE_SECONDS
        value: "300"
